# Konfiguracja muzyki podczas logowania (Resource Pack lub wbudowany dźwięk Minecrafta)
music:
  enabled: true
  # Wpisz nazwę dźwięku z Resource Packa (np. "custom.login_theme") lub nazwę z Minecrafta (np. "MUSIC_DISC_CAT")
  sound: "MUSIC_DISC_CAT"
  display-name: "Muzyka powitalna"
  bossbar: "§d♪ §fAktualnie gra: §b{track} §d♪"
  volume: 0.4
  pitch: 1.0
  # Opóźnienie startu muzyki po wejściu (20 ticków = 1 sekunda)
  delay-ticks: 40
  # Co ile ticków zapętlać utwór podczas oczekiwania na logowanie
  loop-ticks: 365

auth:
  kick-seconds: 60
  particles-enabled: true
